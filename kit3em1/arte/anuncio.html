<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!--
  Arte do anúncio: máscara da identidade Hiper Play sobre a foto real do kit.
  Renderizada para PNG com Chrome headless em 1080x1350 (formato 4:5, o que
  ocupa mais tela no feed do celular). Fonte da verdade do texto: a landing.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1CA9F1; --blue-d:#1492d6; --ink:#0d2438; --orange:#f5661e;
    --green:#34c88f; --amarelo:#ffcf5c; --wpp:#25D366;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact}
  body{width:1080px;height:1350px;overflow:hidden;font-family:'Montserrat',sans-serif;background:#000}
  .arte{position:relative;width:1080px;height:1350px;overflow:hidden}
  .foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* Escurece o topo e o rodape para o texto ter contraste em qualquer foto */
  .veu{position:absolute;inset:0;background:
      linear-gradient(180deg, rgba(8,26,43,.72) 0%, rgba(8,26,43,.18) 26%, rgba(8,26,43,0) 42%),
      linear-gradient(0deg, rgba(8,26,43,.94) 0%, rgba(8,26,43,.80) 24%, rgba(8,26,43,0) 52%)}

  .topo{position:absolute;top:46px;left:52px;right:52px;display:flex;align-items:center;justify-content:space-between}
  .marca{font-family:'Baloo 2',cursive;font-size:64px;font-weight:800;line-height:1;letter-spacing:-1px}
  .marca span{-webkit-text-stroke:7px #fff;paint-order:stroke fill}
  .selo-fab{background:var(--orange);color:#fff;font-size:24px;font-weight:800;padding:14px 26px;border-radius:999px;
            letter-spacing:.5px;box-shadow:0 12px 30px -10px rgba(245,102,30,.8)}

  /* Tarja de urgencia: o criativo anterior rodou 79 mil impressoes e o CTR caiu
     de 3,66% para 1,89%. A contagem e o motivo novo para clicar. */
  .urgencia{position:absolute;top:150px;left:0;right:0;background:#e11d48;color:#fff;
            padding:16px 52px;display:flex;align-items:center;justify-content:space-between;
            box-shadow:0 14px 34px -12px rgba(225,29,72,.75)}
  .urgencia b{font-size:38px;font-weight:900;letter-spacing:.5px;line-height:1}
  .urgencia span{font-size:25px;font-weight:700;opacity:.95}

  /* Selo de economia, girado, como adesivo */
  .adesivo{position:absolute;top:268px;right:46px;background:var(--green);color:#fff;border-radius:28px;
           padding:22px 30px;transform:rotate(7deg);text-align:center;box-shadow:0 18px 40px -14px rgba(0,0,0,.6)}
  .adesivo b{display:block;font-size:34px;line-height:1;font-weight:900}
  .adesivo small{display:block;font-size:19px;font-weight:700;opacity:.95;margin-top:4px}

  .base{position:absolute;left:52px;right:52px;bottom:48px}
  .chamada{font-family:'Baloo 2',cursive;color:#fff;font-size:76px;line-height:1.02;font-weight:800;
           text-shadow:0 6px 24px rgba(0,0,0,.55)}
  .chamada em{font-style:normal;color:var(--amarelo)}
  .itens{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
  .item{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.34);color:#fff;
        font-size:25px;font-weight:700;padding:11px 22px;border-radius:999px;backdrop-filter:blur(3px)}

  .preco{display:flex;align-items:flex-end;gap:22px;margin-top:30px}
  .de{color:#cfe0ee;font-size:30px;font-weight:700;text-decoration:line-through;padding-bottom:16px}
  .por{background:#fff;border-radius:26px;padding:18px 30px;box-shadow:0 20px 44px -18px rgba(0,0,0,.75)}
  .por small{display:block;color:#5a7183;font-size:21px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
  .por b{display:block;color:var(--blue-d);font-family:'Baloo 2',cursive;font-size:72px;line-height:1;font-weight:800}
  .parc{color:#fff;font-size:31px;font-weight:800;padding-bottom:18px}
  .parc span{display:block;font-size:22px;font-weight:700;color:#cfe0ee}

  .rodape{display:flex;align-items:center;justify-content:space-between;margin-top:30px;
          border-top:2px solid rgba(255,255,255,.22);padding-top:22px}
  .prazo{color:#fff;font-size:27px;font-weight:800}
  .prazo span{color:var(--amarelo)}
  .local{color:#cfe0ee;font-size:22px;font-weight:700;text-align:right;line-height:1.35}
</style>
</head>
<body>
<div class="arte">
  <img class="foto" src="../img/kit-1.jpg" alt="">
  <div class="veu"></div>

  <div class="topo">
    <div class="marca">
      <span style="color:#ff5a5f">H</span><span style="color:#ff8a3d">i</span><span style="color:#27c08a">p</span><span style="color:#ffc534">e</span><span style="color:#ff5a5f">r</span>
      <span style="color:#8b5cf6">P</span><span style="color:#ffc534">l</span><span style="color:#27c08a">a</span><span style="color:#ff8a3d">y</span>
    </div>
    <div class="selo-fab">DIRETO DA FÁBRICA</div>
  </div>

  <div class="urgencia">
    <b>ÚLTIMOS DIAS</b>
    <span>acaba 12 de outubro</span>
  </div>

  <div class="adesivo">
    <b>R$ 1.560</b>
    <small>de economia</small>
  </div>

  <div class="base">
    <div class="chamada">O quintal vira o<br><em>lugar preferido</em> da casa</div>

    <div class="itens">
      <div class="item">Balança dupla</div>
      <div class="item">Escorregador</div>
      <div class="item">Gangorra</div>
    </div>

    <div class="preco">
      <div class="de">R$ 4.450</div>
      <div class="por"><small>Kit 3 em 1</small><b>R$ 2.890</b></div>
      <div class="parc">10x de R$ 320<span>no cartão</span></div>
    </div>

    <div class="rodape">
      <div class="prazo">Pedidos até <span>12 de outubro</span></div>
      <div class="local">Fábrica em Araçoiaba da Serra<br>Receba em casa ou retire</div>
    </div>
  </div>
</div>
</body>
</html>
