<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Montar meu Sonho · Hiper Play Playgrounds</title>
<meta name="description" content="Monte o playground dos seus sonhos peça por peça. Combo com 2 ou mais peças ganha 20% de desconto.">
<meta name="theme-color" content="#1CA9F1">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1CA9F1; --blue-d:#1492d6; --blue-royal:#2f6bff; --ink:#16324a; --muted:#65788c; --ice:#eef4fb; --line:#e2e9f2;
    --green:#34c88f; --rosa:#ff7fb0; --amarelo:#ffcf5c; --roxo:#a78bfa; --laranja:#ff9a62;
    --orange:#f5661e; --wpp:#25D366; --sarah:#7b2fbe;
  }
  *{font-family:'Montserrat',sans-serif;-webkit-tap-highlight-color:transparent;}
  body{color:var(--ink);background:#fff;overflow-x:hidden;}
  .brand{font-family:'Baloo 2',cursive;}
  .wordmark span{-webkit-text-stroke:3px #fff;paint-order:stroke fill;}
  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#cdd8e6;border-radius:9px}
  .card{background:#fff;border:1px solid var(--line);border-radius:22px;}
  .chip{border-radius:999px;font-weight:700;font-size:12px;padding:7px 15px;transition:.18s;}
  .btn{border-radius:14px;font-weight:700;transition:.18s;cursor:pointer;}
  .btn:active{transform:scale(.96)}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .floaty{animation:floaty 3.5s ease-in-out infinite}
  @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(30px)}}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.14)}100%{transform:scale(1)}}
  .card-in{animation:cardIn .5s cubic-bezier(.2,.8,.3,1) both}
  .bump{animation:bump .42s ease}
  .reveal{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.3,1)}
  .reveal.in{opacity:1;transform:none}
  /* stickers/mascotes decorativos (estilo da referência: carinhas fofas) */
  .nuvem{position:absolute;color:#fff;opacity:.9;animation:floaty 6s ease-in-out infinite}
  .sticker{position:absolute;animation:floaty 5s ease-in-out infinite}
  .clic{cursor:pointer;pointer-events:auto;transition:transform .15s}
  .clic:active{transform:scale(.85)}
  /* chuva de stickers ao clicar */
  #ceu{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
  .gota{position:absolute;top:-8vh;will-change:transform,opacity;animation:cair linear forwards}
  @keyframes cair{0%{transform:translateY(-8vh) rotate(0);opacity:0}12%{opacity:1}100%{transform:translateY(112vh) rotate(var(--r,360deg));opacity:.25}}
  /* toast */
  #toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(10px);z-index:95;background:#16324a;color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s}
  #toast.in{opacity:1;transform:translateX(-50%) translateY(0)}
  /* tile de categoria com gradiente (como os cards da referência) */
  .cat-tile{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:0 10px 22px -12px var(--c2)}
  /* card de peça: seleção viva */
  .peca{transition:.2s;cursor:pointer;position:relative;overflow:hidden}
  .peca:hover{transform:translateY(-4px);box-shadow:0 18px 34px -22px rgba(20,50,80,.5)}
  .peca.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
  .pecaimg{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#eef4fb,#dbe7f5);display:grid;place-items:center}
  .pecaimg img{width:100%;height:100%;object-fit:contain;padding:8px;background:#fff}
  .pecaimg .svgwrap{width:56%;max-width:120px}
  .step{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:18px;line-height:1;border:none;cursor:pointer;transition:.15s}
  .step:active{transform:scale(.9)}
  /* barra de resumo fixa */
  #resumo{position:fixed;left:0;right:0;bottom:0;z-index:60;transform:translateY(120%);transition:transform .35s cubic-bezier(.2,.8,.3,1);padding-bottom:env(safe-area-inset-bottom,0)}
  #resumo.show{transform:none}
  /* SARAH flutuante */
  #sarah{position:fixed;right:16px;z-index:65;bottom:96px;display:flex;align-items:flex-end;gap:10px;flex-direction:row-reverse}
  #sarahFala{max-width:220px;background:#fff;border:1px solid var(--line);border-radius:16px;border-bottom-right-radius:4px;padding:10px 13px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:0 14px 34px -16px rgba(20,50,80,.5);animation:pop .3s ease}
  #sarahAv{width:56px;height:56px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:#fff;box-shadow:0 14px 30px -10px rgba(123,47,190,.7);background:linear-gradient(135deg,#8b5cf6,#4aa3df);cursor:pointer}
  @media (max-width:420px){ #sarahFala{max-width:150px;font-size:12px} #sarah{bottom:104px;right:12px} }
  @media (prefers-reduced-motion: reduce){ .floaty,.nuvem,.sticker,.card-in,.bump{animation:none} .reveal{opacity:1;transform:none} }
</style>
</head>
<body class="pb-40">
<div id="ceu" aria-hidden="true"></div>
<div id="toast"></div>

<!-- HEADER -->
<header class="sticky top-0 z-50 backdrop-blur border-b" style="background:linear-gradient(135deg,#28b4f5,#1492d6);border-color:rgba(255,255,255,.18)">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
    <a href="/" class="select-none leading-none">
      <span class="wordmark brand text-2xl sm:text-3xl font-extrabold block">
        <span style="color:#ff5a5f">H</span><span style="color:#ff8a3d">i</span><span style="color:#27c08a">p</span><span style="color:#ffc534">e</span><span style="color:#ff5a5f">r</span>
        <span style="color:#8b5cf6">P</span><span style="color:#ffc534">l</span><span style="color:#27c08a">a</span><span style="color:#ff8a3d">y</span>
      </span>
      <span class="block italic font-semibold text-white/90 text-[10px] sm:text-xs tracking-wide -mt-0.5">Fábrica de Sonhos</span>
    </a>
    <a href="/" class="flex items-center gap-1.5 text-white text-sm font-semibold px-3 py-2 rounded-full transition hover:bg-white/25" style="background:#ffffff1f">
      <i data-lucide="arrow-left" style="width:16px;height:16px"></i> Voltar à loja
    </a>
  </div>
</header>

<!-- HERO com céu, nuvenzinhas e jardim -->
<section class="relative overflow-hidden" style="background:linear-gradient(150deg,#2f6bff 0%,#1CA9F1 55%,#1492d6 100%)">
  <!-- mascotes/stickers com carinha (clicáveis: fazem chuva) -->
  <div class="nuvem floaty clic" style="top:20px;left:5%;width:96px" data-svg="nuvem" onclick="chuva('nuvem')" title="Toque em mim!"></div>
  <div class="nuvem clic" style="top:70px;right:8%;width:70px;opacity:.8;animation-delay:1.2s" data-svg="nuvem" onclick="chuva('nuvem')" title="Toque em mim!"></div>
  <div class="sticker clic" style="top:30px;right:16%;width:52px;animation-delay:.4s" data-svg="sol" onclick="chuva('sol')" title="Toque em mim!"></div>
  <div class="sticker clic" style="bottom:96px;left:8%;width:40px;animation-delay:.9s" data-svg="coracao" onclick="chuva('coracao')" title="Toque em mim!"></div>

  <div class="max-w-4xl mx-auto px-4 pt-10 pb-24 sm:pt-14 sm:pb-28 text-center text-white relative">
    <div id="heroBadgeWrap" class="inline-flex items-center gap-2 chip mb-3 text-white" style="background:var(--orange);box-shadow:0 8px 20px -8px var(--orange)">
      <i data-lucide="sparkles" style="width:14px;height:14px"></i> <span id="heroBadge">Combo com 2+ peças ganha 20% OFF</span>
    </div>
    <h1 id="heroTitulo" class="brand text-3xl sm:text-5xl font-extrabold leading-tight">Montar meu Sonho</h1>
    <p id="heroSub" class="mt-3 text-white/90 max-w-xl mx-auto">Escolha as peças e monte o playground perfeito. O valor vai se ajustando enquanto você seleciona.</p>
  </div>

  <!-- jardim (grama) + terreno -->
  <div class="absolute bottom-0 left-0 right-0" data-svg="jardim" aria-hidden="true"></div>
</section>

<!-- PEÇAS -->
<main class="max-w-5xl mx-auto px-4 py-8" id="secoes">
  <div class="text-center text-[var(--muted)] py-16" id="carregando">Carregando as peças…</div>
</main>

<!-- SARAH flutuante -->
<div id="sarah">
  <button id="sarahAv" onclick="montarSonho()" title="Falar com a SARAH no WhatsApp" aria-label="Falar com a SARAH">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
  </button>
  <div id="sarahFala">Oi! Sou a SARAH 💜 Toque nas peças para montar seu sonho.</div>
</div>

<!-- BARRA DE RESUMO FIXA -->
<div id="resumo">
  <div class="max-w-5xl mx-auto px-3 pb-3">
    <div class="card p-3 sm:p-4 flex items-center gap-3" style="box-shadow:0 -10px 40px -20px rgba(20,50,80,.5)">
      <div class="min-w-0 flex-1">
        <div class="flex items-baseline gap-2 flex-wrap">
          <span id="rTotal" class="brand text-2xl font-extrabold" style="color:var(--blue-d)">R$ 0,00</span>
          <span id="rSubRiscado" class="text-sm text-[var(--muted)] line-through hidden"></span>
        </div>
        <div id="rLinha" class="text-[11px] text-[var(--muted)] mt-0.5">Nenhuma peça ainda</div>
      </div>
      <button class="btn shrink-0 grid place-items-center" style="width:44px;height:44px;background:var(--ice);color:var(--blue-d)" onclick="copiarLink()" title="Copiar link" aria-label="Copiar link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      </button>
      <button class="btn shrink-0 grid place-items-center" style="width:44px;height:44px;background:var(--sarah);color:#fff" onclick="compartilhar()" title="Compartilhar no WhatsApp" aria-label="Compartilhar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
      </button>
      <button class="btn text-white text-sm px-4 sm:px-5 py-3 flex items-center gap-2 shrink-0" style="background:var(--wpp)" onclick="montarSonho()">
        <svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.945C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.51 5.26l-.999 3.648 3.978-1.042zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/></svg>
        <span class="hidden sm:inline">Montar meu Sonho</span><span class="sm:hidden">Finalizar</span>
      </button>
    </div>
  </div>
</div>

<script>
const WPP='5515997670033';
// Config default; sobrescrita pelo painel via /api/meusonho/config (carregarConfig).
let DESCONTO_COMBO=0.20;       // fração do desconto do combo
let COMBO_MINIMO=2;            // a partir de quantas peças vira combo
let COMBO_ATIVO=true;          // liga/desliga o desconto (controlado no painel)
const PCT=()=>Math.round(DESCONTO_COMBO*100);
const slug=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_');
function fmtBRL(v){ const n=Number(v)||0; if(!n) return 'Sob consulta'; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ===== ICONOGRAFIA — SVGs próprios dos brinquedos (estilo lúdico da marca) =====
// currentColor pega a cor da categoria; desenhados com primitivas para ficarem nítidos.
const SVG={
  // brinquedos como stickers coloridos e cheios (universo lúdico da marca)
  balanco:`<svg viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M32 12 17 52M32 12 47 52M22 12h20" stroke="#2f6bff" stroke-width="6"/><path d="M28 15v18M36 15v18" stroke="#8bd0ff" stroke-width="3"/><rect x="22" y="33" width="20" height="7" rx="3.5" fill="#ffc534"/></svg>`,
  escorregador:`<svg viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M44 20v30M52 20v30" stroke="#ff8a3d" stroke-width="5"/><path d="M44 28h8M44 36h8M44 44h8" stroke="#ff8a3d" stroke-width="4"/><path d="M45 19c-19 6-31 15-35 31 0 2 2 3 4 3 6-16 18-25 34-28z" fill="#ffc534"/><path d="M9 53h47" stroke="#34c88f" stroke-width="5"/></svg>`,
  giragira:`<svg viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="50" rx="21" ry="5" fill="#8bd0ff"/><path d="M32 15v31" stroke="#2f6bff" stroke-width="5"/><path d="M13 27 32 14 51 27z" fill="#ff5a7a"/><circle cx="32" cy="12" r="3" fill="#ffc534"/><path d="M20 46 32 40 44 46" stroke="#2f6bff" stroke-width="4" fill="none"/></svg>`,
  gangorra:`<svg viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M32 30 25 52h14z" fill="#ff8a3d"/><path d="M12 42 52 22" stroke="#34c88f" stroke-width="6"/><circle cx="12" cy="42" r="4.5" fill="#ff5a7a"/><circle cx="52" cy="22" r="4.5" fill="#2f6bff"/><path d="M8 53h48" stroke="#8bd0ff" stroke-width="4"/></svg>`,
  playground:`<svg viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 27 30 13 46 27z" fill="#ff5a7a"/><path d="M20 27v23M40 27v23" stroke="#2f6bff" stroke-width="5"/><rect x="19" y="34" width="22" height="5" rx="2.5" fill="#ffc534"/><path d="M40 35c14 3 15 12 12 17" stroke="#34c88f" stroke-width="5" fill="none"/><path d="M8 53h48" stroke="#8bd0ff" stroke-width="4"/></svg>`,
  brinquedo:`<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="19" fill="#2f6bff"/><path d="M32 13c-8 8-8 30 0 38M32 13c8 8 8 30 0 38M13 32h38" stroke="#fff" stroke-width="3"/><circle cx="32" cy="32" r="4" fill="#ffc534"/></svg>`,
  // nuvem com carinha fofa (estilo sticker da referência)
  nuvem:`<svg viewBox="0 0 96 64" fill="none"><path fill="#fff" d="M26 56h44a15 15 0 0 0 3-29.7A20 20 0 0 0 35 20 14 14 0 0 0 14 32a13 13 0 0 0 12 24z"/><circle cx="40" cy="38" r="2.6" fill="#16324a"/><circle cx="56" cy="38" r="2.6" fill="#16324a"/><path d="M40 45q8 6 16 0" stroke="#16324a" stroke-width="2.6" stroke-linecap="round" fill="none"/><circle cx="34" cy="44" r="3" fill="#ff7fb0" opacity=".7"/><circle cx="62" cy="44" r="3" fill="#ff7fb0" opacity=".7"/></svg>`,
  sol:`<svg viewBox="0 0 64 64" fill="none"><g stroke="#ffcf5c" stroke-width="4" stroke-linecap="round"><path d="M32 6v7M32 51v7M6 32h7M51 32h7M13 13l5 5M46 46l5 5M51 13l-5 5M18 46l-5 5"/></g><circle cx="32" cy="32" r="14" fill="#ffcf5c"/><circle cx="27" cy="30" r="2" fill="#16324a"/><circle cx="37" cy="30" r="2" fill="#16324a"/><path d="M27 37q5 4 10 0" stroke="#16324a" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>`,
  coracao:`<svg viewBox="0 0 64 64" fill="none"><path d="M32 56S8 40 8 24a13 13 0 0 1 24-6 13 13 0 0 1 24 6c0 16-24 32-24 32z" fill="#ff5a7a"/><circle cx="25" cy="27" r="2" fill="#fff"/><circle cx="39" cy="27" r="2" fill="#fff"/><path d="M26 33q6 4 12 0" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>`,
  // fita ondulada (assinatura da referência)
  fita:`<svg viewBox="0 0 1440 120" preserveAspectRatio="none" fill="none" style="display:block;width:100%;height:120px"><path d="M-20 70C160 10 320 120 520 70S900 0 1100 60s300 20 380-10" stroke="#ff7a2e" stroke-width="9" stroke-linecap="round" opacity=".9"/></svg>`,
  jardim:`<svg viewBox="0 0 1440 90" preserveAspectRatio="none" style="display:block;width:100%;height:64px"><path fill="#3fbf88" d="M0 40c120 26 260 26 380 8s260-30 380-14 240 34 360 30 200-20 320-30v96H0z"/><path fill="#34c88f" d="M0 58c150 18 300 6 470-4s330-8 500 4 240 18 470 6v26H0z"/></svg>`,
};

// ===== estilo por categoria (cor + ícone) — 100% plug-and-play =====
// Casa a categoria cadastrada no app com um ícone do universo da marca pelo nome.
// Categoria nova que não casa: ganha o ícone genérico e uma cor estável da paleta
// (derivada do nome), então o admin cria categorias no sistema sem tocar no código.
const PALETA_CAT=['#1CA9F1','#ff9a62','#34c88f','#ff7fb0','#a78bfa','#2f6bff','#f5661e','#ffcf5c'];
function corEstavel(nome){ let h=0; for(let i=0;i<(nome||'').length;i++) h=(h*31+nome.charCodeAt(i))>>>0; return PALETA_CAT[h%PALETA_CAT.length]; }
function estiloCat(nome){
  const n=(nome||'').toLowerCase();
  if(n.includes('balanc')||n.includes('balanç')) return {cor:'#1CA9F1', svg:SVG.balanco};
  if(n.includes('escorreg'))                     return {cor:'#ff9a62', svg:SVG.escorregador};
  if(n.includes('gira'))                          return {cor:'#34c88f', svg:SVG.giragira};
  if(n.includes('gangorra'))                      return {cor:'#ff7fb0', svg:SVG.gangorra};
  if(n.includes('conjunto')||n.includes('combo')||n.includes('playground')) return {cor:'#a78bfa', svg:SVG.playground};
  return {cor:corEstavel(nome), svg:SVG.brinquedo};
}

// ===== Origem do clique (Google Ads) — mesmo mecanismo da loja =====
const API_SISTEMA='https://app.hiperplay.com.br';
const HP_CLIQUE='hp_clique';
const VALIDADE_CLIQUE=90*24*60*60*1000;
const ALFABETO='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function novoCodigo(){ const b=new Uint8Array(6); (window.crypto||window.msCrypto).getRandomValues(b); let s=''; for(let i=0;i<6;i++) s+=ALFABETO[b[i]%ALFABETO.length]; return s; }
function lerClique(){ try{ const r=JSON.parse(localStorage.getItem(HP_CLIQUE)||'null'); if(!r||!r.cod) return null; if(Date.now()-(r.ts||0)>VALIDADE_CLIQUE){ localStorage.removeItem(HP_CLIQUE); return null; } return r; }catch(e){ return null; } }
(function capturarClique(){ try{ const q=new URLSearchParams(location.search); const gclid=q.get('gclid'),gbraid=q.get('gbraid'),wbraid=q.get('wbraid'); if(!gclid&&!gbraid&&!wbraid) return; localStorage.setItem(HP_CLIQUE,JSON.stringify({cod:novoCodigo(),gclid,gbraid,wbraid,ts:Date.now(),camp:q.get('utm_campaign')||null,enviado:false})); }catch(e){} })();
function registrarClique(){ const r=lerClique(); if(!r||r.enviado) return; fetch(API_SISTEMA+'/api/ads/click',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cod:r.cod,gclid:r.gclid,gbraid:r.gbraid,wbraid:r.wbraid,camp:r.camp}),keepalive:true}).then(res=>{ if(res.ok){ r.enviado=true; try{ localStorage.setItem(HP_CLIQUE,JSON.stringify(r)); }catch(e){} } }).catch(()=>{}); }
function comCodigo(ref){ const r=lerClique(); return r? ref+'-'+r.cod : ref; }

// Sem lista fixa: a pagina mostra APENAS os produtos reais cadastrados no
// sistema (folha tecnica). Nada e inventado; sem banco, fica o estado vazio.
async function carregarDoBanco(){
  if(!sb) return null;
  try{
    const [cats, prods] = await Promise.all([
      sb.from('product_categories').select('id,name,position').eq('org_id',SB_ORG).order('position'),
      sb.from('products').select('name,description,price,images,image_url,category_id,linha,active').eq('org_id',SB_ORG).eq('active',true).order('name'),
    ]);
    const data=prods.data;
    if(prods.error||!data||!data.length) return null;
    const nomeCat={}; (cats.data||[]).forEach(c=>{ nomeCat[c.id]=c.name; });
    return data.map(p=>{
      const imgs=Array.isArray(p.images)&&p.images.length?p.images.filter(Boolean):(p.image_url?[p.image_url]:[]);
      return { id:slug(p.name), nome:p.name, cat:(nomeCat[p.category_id]||p.linha||'Outros'), preco:Number(p.price)||0, foto:imgs[0]||null };
    });
  }catch(e){ console.warn('supabase:',e.message||e); return null; }
}

// ===== estado =====
let PECAS=[];         // peças atuais (banco ou fallback)
const estado={};      // id -> quantidade
const qtd=id=>estado[id]||0;
const totalPecas=()=>Object.values(estado).reduce((a,b)=>a+b,0);
function inc(id){ estado[id]=qtd(id)+1; render(); }
function dec(id){ estado[id]=Math.max(0,qtd(id)-1); if(!estado[id]) delete estado[id]; render(); }

// ===== render das seções (agrupa por categoria, na ordem de aparição) =====
function renderSecoes(){
  const wrap=document.getElementById('secoes');
  const ordem=[]; const grupos={};
  PECAS.forEach(p=>{ const c=p.cat||'Outros'; if(!grupos[c]){ grupos[c]=[]; ordem.push(c); } grupos[c].push(p); });
  if(!ordem.length){
    wrap.innerHTML=`<div class="card p-8 text-center max-w-md mx-auto my-10">
      <div class="brand text-2xl font-extrabold mb-1">Catálogo em atualização</div>
      <p class="text-[var(--muted)] text-sm mb-4">As peças estão sendo preparadas no sistema. Fale com a gente que montamos seu sonho na hora.</p>
      <a href="https://wa.me/${WPP}?text=${encodeURIComponent('Olá! Quero montar meu playground dos sonhos na Hiper Play.')}" target="_blank" class="btn inline-flex items-center gap-2 text-white px-5 py-3" style="background:var(--wpp)">Falar no WhatsApp</a>
    </div>`;
    return;
  }

  let idx=0;   // índice global p/ escalonar a entrada dos cards
  wrap.innerHTML=ordem.map(cat=>{
    const st=estiloCat(cat);
    return `
    <section class="mb-8 reveal">
      <div class="flex items-center gap-2.5 mb-3">
        <span class="w-11 h-11 rounded-2xl grid place-items-center p-1.5 shrink-0" style="background:${st.cor}1f">${st.svg}</span>
        <h2 class="brand text-lg sm:text-xl font-extrabold">${esc(cat)}</h2>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
        ${grupos[cat].map(p=>{
          const c=estiloCat(p.cat).cor;
          const visual = p.foto
            ? `<img src="${esc(p.foto)}" alt="${esc(p.nome)}" loading="lazy">`
            : `<span class="svgwrap">${estiloCat(p.cat).svg}</span>`;
          const d=(idx++)*45;
          return `
          <div class="card peca card-in p-3 flex flex-col" id="card_${p.id}" style="--ac:${c};animation-delay:${d}ms">
            <div class="pecaimg mb-2">${visual}</div>
            <h3 class="font-bold leading-snug flex-1 text-sm sm:text-base">${esc(p.nome)}</h3>
            <div class="font-extrabold text-base sm:text-lg mt-1" style="color:${c}">${fmtBRL(p.preco)}</div>
            <div class="flex items-center gap-2 mt-3">
              <button class="step" style="background:${c}1a;color:${c}" onclick="dec('${p.id}')" aria-label="Remover">−</button>
              <span class="w-6 text-center font-bold tabular-nums" id="q_${p.id}">0</span>
              <button class="step text-white" style="background:${c}" onclick="inc('${p.id}')" aria-label="Adicionar">+</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </section>`;
  }).join('');
  observarReveal();
  render();
}

// ===== fala da SARAH conforme o progresso =====
function falaSarah(n){
  if(n===0) return 'Oi! Sou a SARAH 💜 Toque nas peças para montar seu sonho.';
  if(!COMBO_ATIVO){ return n>=1 ? 'Que sonho lindo! Quando quiser, é só finalizar comigo no WhatsApp.' : 'Toque nas peças para montar seu sonho.'; }
  if(n<COMBO_MINIMO) return `Boa escolha! Chegue a ${COMBO_MINIMO} peças e ganhe ${PCT()}% no combo.`;
  if(n<=COMBO_MINIMO+1) return `Combo ativado! Você já está com ${PCT()}% de desconto 🎉`;
  return 'Que sonho lindo! Quando quiser, é só finalizar comigo no WhatsApp.';
}

// ===== render vivo (barra + quantidades + SARAH) =====
function render(){
  let subtotal=0;
  PECAS.forEach(p=>{
    const q=qtd(p.id); subtotal+=q*p.preco;
    const qEl=document.getElementById('q_'+p.id); if(qEl) qEl.textContent=q;
    const card=document.getElementById('card_'+p.id); if(card) card.classList.toggle('on',q>0);
  });
  const n=totalPecas();
  const combo=COMBO_ATIVO && n>=COMBO_MINIMO;
  const desconto=combo?subtotal*DESCONTO_COMBO:0;
  const total=subtotal-desconto;

  document.getElementById('resumo').classList.toggle('show',n>0);
  const rTotal=document.getElementById('rTotal');
  const novoTotal=fmtBRL(total);
  if(rTotal.textContent!==novoTotal){ rTotal.textContent=novoTotal; rTotal.classList.remove('bump'); void rTotal.offsetWidth; rTotal.classList.add('bump'); }
  const risc=document.getElementById('rSubRiscado');
  if(combo){ risc.textContent=fmtBRL(subtotal); risc.classList.remove('hidden'); }
  else risc.classList.add('hidden');

  const plural=n===1?'peça':'peças';
  const faltam=Math.max(0,COMBO_MINIMO-n);
  document.getElementById('rLinha').innerHTML = n===0
    ? 'Nenhuma peça ainda'
    : combo
      ? `${n} ${plural} · <b style="color:var(--green)">combo −${PCT()}% (${fmtBRL(desconto)})</b>`
      : (COMBO_ATIVO ? `${n} ${plural} · +${faltam} e ganhe <b>${PCT()}%</b>` : `${n} ${plural}`);

  document.getElementById('sarahFala').textContent=falaSarah(n);
}

// ===== finalizar: leva o sonho montado pro WhatsApp =====
function montarSonho(){
  const escolhidas=PECAS.filter(p=>qtd(p.id)>0);
  const ref=comCodigo('HP-MEUSONHO');
  if(!escolhidas.length){
    const msg=encodeURIComponent('Olá! Quero montar meu playground dos sonhos na Hiper Play. Pode me ajudar?');
    window.open('https://wa.me/'+WPP+'?text='+msg,'_blank'); return;
  }
  let subtotal=0;
  const linhas=escolhidas.map(p=>{ const q=qtd(p.id); const st=q*p.preco; subtotal+=st; return `• ${q}x ${p.nome} — ${fmtBRL(st)}`; });
  const n=totalPecas();
  const combo=COMBO_ATIVO && n>=COMBO_MINIMO;
  const desconto=combo?subtotal*DESCONTO_COMBO:0;
  const total=subtotal-desconto;

  let txt='*Meu Sonho — Hiper Play*%0A%0A*Peças escolhidas:*%0A';
  txt+=linhas.map(l=>encodeURIComponent(l)).join('%0A');
  txt+='%0A%0A'+encodeURIComponent(`*Subtotal:* ${fmtBRL(subtotal)}`);
  if(combo) txt+='%0A'+encodeURIComponent(`*Desconto combo (${PCT()}%):* -${fmtBRL(desconto)}`);
  txt+='%0A'+encodeURIComponent(`*Total:* ${fmtBRL(total)}`);
  txt+='%0A%0A'+encodeURIComponent(`_Origem: Loja Hiper Play • Montar meu Sonho • Ref: ${ref}_`);
  window.open('https://wa.me/'+WPP+'?text='+txt,'_blank');
}

// ===== config editável no painel (desconto do combo + textos) =====
// Lê de app.hiperplay.com.br/api/meusonho/config. Falha? mantém os defaults.
async function carregarConfig(){
  try{
    const r=await fetch(API_SISTEMA+'/api/meusonho/config',{cache:'no-store'});
    if(!r.ok) return;
    const c=await r.json();
    if(typeof c.desconto==='number') DESCONTO_COMBO=Math.min(0.9,Math.max(0,c.desconto/100));
    if(typeof c.min_combo==='number') COMBO_MINIMO=Math.max(1,Math.round(c.min_combo));
    COMBO_ATIVO = c.ativo!==false;
    const setTxt=(id,v)=>{ const el=document.getElementById(id); if(el&&v) el.textContent=v; };
    setTxt('heroTitulo',c.titulo);
    setTxt('heroSub',c.subtitulo);
    setTxt('heroBadge',c.badge);
    document.getElementById('heroBadgeWrap').style.display = COMBO_ATIVO ? '' : 'none';
  }catch(e){ /* mantém defaults */ }
}

// ===== decorações (nuvens + jardim) =====
function pintarDecor(){
  document.querySelectorAll('[data-svg]').forEach(el=>{ const k=el.getAttribute('data-svg'); if(SVG[k]) el.innerHTML=SVG[k]; });
}

// ===== reveal das seções ao rolar (observer reaproveitável p/ conteúdo dinâmico) =====
let _io=null;
function observarReveal(){
  if(!('IntersectionObserver' in window)){ document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in')); return; }
  if(!_io) _io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); _io.unobserve(e.target); } }),{threshold:.08});
  document.querySelectorAll('.reveal:not(.in)').forEach(el=>{ if(!el.dataset.obs){ el.dataset.obs='1'; _io.observe(el); } });
  // failsafe: nada pode ficar invisível
  setTimeout(()=>document.querySelectorAll('.reveal:not(.in)').forEach(el=>el.classList.add('in')),1400);
}

// ===== stickers interativos: chuva de nuvem/sol/coração ao clicar =====
function chuva(tipo){
  const ceu=document.getElementById('ceu'); if(!ceu||!SVG[tipo]) return;
  for(let i=0;i<16;i++){
    const s=document.createElement('span');
    s.className='gota'; s.innerHTML=SVG[tipo];
    const tam=18+Math.random()*28;
    s.style.width=tam+'px';
    s.style.left=(Math.random()*96)+'vw';
    s.style.setProperty('--r',(Math.random()*720-360)+'deg');
    const dur=2.2+Math.random()*1.8;
    s.style.animationDuration=dur+'s';
    s.style.animationDelay=(Math.random()*0.5)+'s';
    ceu.appendChild(s);
    setTimeout(()=>s.remove(),(dur+0.7)*1000);
  }
}

// ===== compartilhar / copiar link (com a montagem embutida) =====
function linkComSelecao(){
  const partes=PECAS.filter(p=>qtd(p.id)>0).map(p=>p.id+':'+qtd(p.id));
  const base=location.origin+'/meusonho';
  return partes.length ? base+'?s='+encodeURIComponent(partes.join(',')) : base;
}
function restaurarSelecao(){
  try{
    const s=new URLSearchParams(location.search).get('s'); if(!s) return;
    s.split(',').forEach(par=>{ const [id,q]=par.split(':'); const n=parseInt(q,10); if(id&&n>0&&PECAS.some(p=>p.id===id)) estado[id]=Math.min(n,99); });
  }catch(e){}
}
let _toastT=null;
function toast(msg){ const t=document.getElementById('toast'); if(!t) return; t.textContent=msg; t.classList.add('in'); clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('in'),1900); }
async function copiarLink(){
  const url=linkComSelecao();
  try{ await navigator.clipboard.writeText(url); toast('Link copiado! 📋'); }
  catch(e){ window.prompt('Copie o link do seu sonho:', url); }
}
async function compartilhar(){
  const url=linkComSelecao();
  const texto='Olha o playground que montei na Hiper Play! 😍';
  if(navigator.share){
    try{ await navigator.share({title:'Meu Sonho — Hiper Play', text:texto, url}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  // fallback: abre o WhatsApp e deixa escolher a conversa
  window.open('https://wa.me/?text='+encodeURIComponent(texto+' '+url),'_blank');
}

// ===== init =====
async function bootstrap(){
  await carregarConfig();   // aplica desconto/textos definidos no painel
  const doBanco=await carregarDoBanco();
  PECAS = (doBanco && doBanco.length) ? doBanco : [];   // só produtos reais; nada inventado
  restaurarSelecao();   // se o link trouxe uma montagem, reidrata antes de renderizar
  renderSecoes();
  // tempo real: catálogo mudou no sistema → recarrega as peças
  if(sb){
    sb.channel('pub-meusonho')
      .on('postgres_changes',{event:'*',schema:'public',table:'products'}, async ()=>{ const d=await carregarDoBanco(); if(d&&d.length){ PECAS=d; renderSecoes(); } })
      .subscribe();
  }
}

pintarDecor();
bootstrap();
registrarClique();
lucide.createIcons();
